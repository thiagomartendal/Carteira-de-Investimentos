<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Carteira de Investimentos
    </title>
    <link href="/static/css/account.css" type="text/css" rel="stylesheet" />
    <script src="/static/js/script.js" type="text/javascript"></script>
  </head>
  <body>
    <main>
      <article>
        <section>
          <h1>Carteira de Investimentos</h1>
          <h2>Acesse sua Carteira</h2>
        </section>
        <section>
          <form method="POST" action="/login">
            <input type="email" name="email" placeholder="Email" autocomplete="username" required />
            <input type="password" name="password" placeholder="Senha" autocomplete="password" required />
            <div id="check">
              <input type="checkbox" id="check-login" name="save_session" value="save" />
              <label for="check-login">Continuar conectado</label>
            </div>
            <input type="submit" value="Entrar" />
            <input type="button" value="Nova Conta" onclick="href('/new-account')" />
          </form>
        </section>
        <section class="error_msg">
          {% if !error_msg.is_empty() %}
            {{ error_msg }}
          {% endif %}
        </section>
      </article>
    </main>
  </body>
</html>
